# Runs the Aether image published to GHCR by .github/workflows/docker.yml.
# Deploy = pull the image, then bring the stack up:
#
#   cp .env.example .env      # fill in the three secrets
#   docker compose pull
#   docker compose up -d
#
# Pin GATEWAY_IMAGE_TAG to a commit SHA tag from a known-good build for
# reproducible deploys (see the package's tags on GHCR).
#
# IMAGE MIGRATION (repository renamed to Aether):
#   The default still points at the pre-rename package because it is the one
#   that actually exists today: every image built and published so far lives
#   under ghcr.io/xiaonan-520/multi-provider-ai-gateway. Existing deployments
#   are therefore untouched — a running stack is not re-pulled unless you
#   explicitly run `docker compose pull`.
#
#   CI derives the image path from ${GITHUB_REPOSITORY,,}, so the first run
#   created AFTER the rename publishes to ghcr.io/xiaonan-520/aether. Once
#   that package exists and is verified, switch the default here (one line) or
#   opt in per deployment without editing this file:
#     GATEWAY_IMAGE_REPO=ghcr.io/xiaonan-520/aether
services:
  gateway:
    image: ${GATEWAY_IMAGE_REPO:-ghcr.io/xiaonan-520/multi-provider-ai-gateway}:${GATEWAY_IMAGE_TAG:-latest}
    container_name: ai-gateway
    ports:
      - "8080:8080"
    volumes:
      - gateway-data:/data
    environment:
      # Do NOT put real secrets in this file; use an .env file next to it
      # (compose reads it automatically) or docker secrets.
      DATA_DIR: /data
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:?set GATEWAY_API_KEY in .env}
      GATEWAY_SECRET: ${GATEWAY_SECRET:?set GATEWAY_SECRET in .env}
      GATEWAY_ADMIN_TOKEN: ${GATEWAY_ADMIN_TOKEN:?set GATEWAY_ADMIN_TOKEN in .env}
      TZ: ${TZ:-Asia/Shanghai}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  # Named volume (not a bind mount): Docker initialises it from the image's
  # /data, which the Dockerfile chowns to the non-root `gateway` user. A bind
  # mount would override that ownership and the process could not write the db.
  gateway-data:
